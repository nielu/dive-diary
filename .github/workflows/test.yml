name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download PocketBase (same version as the Dockerfile)
        run: |
          PB_VERSION=$(sed -n 's/^ARG PB_VERSION=//p' Dockerfile)
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o pb.zip pocketbase -d backend

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        run: ./scripts/test.sh

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
